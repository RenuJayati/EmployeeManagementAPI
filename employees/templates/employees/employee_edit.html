{% extends 'employees/base.html' %}

{% block title %}
Edit Employee
{% endblock %}

{% block page_title %}
Edit Employee
{% endblock %}

{% block content %}

<div class="card p-4">

    <h5 class="mb-4">Edit Employee</h5>

    <form method="post">

        {% csrf_token %}

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ employee.name }}"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ employee.email }}"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ employee.phone }}"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Designation</label>
                <input
                    type="text"
                    name="designation"
                    class="form-control"
                    value="{{ employee.designation }}"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Salary</label>
                <input
                    type="number"
                    name="salary"
                    class="form-control"
                    value="{{ employee.salary }}"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Joining Date</label>
                <input
                    type="date"
                    name="joining_date"
                    class="form-control"
                    value="{{ employee.joining_date|date:'Y-m-d' }}"
                    required
                >
            </div>

            <div class="col-md-6">

                <label class="form-label">Department</label>

                <select name="department" class="form-select" required>

                    {% for department in departments %}

                    <option
                        value="{{ department.id }}"
                        {% if department.id == employee.department.id %}
                        selected
                        {% endif %}
                    >
                        {{ department.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <button class="btn btn-dark mt-4">
            Update Employee
        </button>

        <a href="/employees/" class="btn btn-secondary mt-4">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
