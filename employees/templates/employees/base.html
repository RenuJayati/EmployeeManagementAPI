<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Employee Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 250px;
            height: 100vh;

            background: #111827;

            position: fixed;
            left: 0;
            top: 0;

            padding: 28px 16px;

            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);

            z-index: 1000;
        }

        .sidebar h3 {
    color: white;

    text-align: left;

    padding-left: 12px;

    margin-bottom: 40px;

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 0.5px;
}

        .sidebar a {
    display: block;

    color: #cbd5e1;

    text-decoration: none;

    padding: 13px 15px;

    border-radius: 10px;

    margin-bottom: 8px;

    font-size: 15px;

    transition: 0.2s;
}

        .sidebar a:hover {
    background: #1f2937;

    color: white;

    transform: translateX(3px);
}

       .main {
    margin-left: 250px;

    padding: 32px;
}

        .topbar {
            background: white;
            padding: 18px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

       .card {
    border: none;

    border-radius: 16px;

    background: white;

    box-shadow:
        0 4px 18px rgba(15, 23, 42, 0.06);

    transition: 0.2s;
}

.dashboard-icon {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;
    color: #111827;

    border-radius: 10px;

    font-size: 19px;

    margin-bottom: 18px;
}

.dashboard-card {
    height: 100%;
}

.dashboard-label {
    color: #6b7280;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
}

.dashboard-number {
    color: #111827;
    font-size: 28px;
    font-weight: 700;
    margin: 0;
}

.recent-title {
    color: #111827;
    font-size: 18px;
    font-weight: 700;
}

.employee-table thead th {
    color: #6b7280;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #e5e7eb;
}

.employee-table tbody td {
    color: #374151;
    font-size: 14px;
    padding-top: 15px;
    padding-bottom: 15px;
}

.employee-table tbody tr:last-child td {
    border-bottom: none;
}

.card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(15, 23, 42, 0.09);
}

        .user-box {
    display: flex;
    align-items: center;
    gap: 12px;

    background: #1f2937;

    padding: 12px;

    border-radius: 10px;

    margin-bottom: 25px;

    color: white;
}

.user-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #374151;

    border-radius: 50%;
}

.user-box small {
    display: block;

    color: #9ca3af;

    font-size: 11px;

    margin-bottom: 2px;
}

.user-box strong {
    display: block;

    font-size: 14px;

    color: white;
}
        @media (max-width: 768px) {

    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .sidebar h3 {
        text-align: center;
    }

    .user-box {
        max-width: 300px;
        margin-left: auto;
        margin-right: auto;
    }

}

      .employee-page-title {
    color: #111827;
    font-size: 20px;
    font-weight: 700;
}

.employee-search {
    display: flex;
    gap: 10px;
}

.employee-search .form-control {
    height: 44px;
    border-radius: 10px;
}

.employee-search .btn {
    border-radius: 10px;
}

        .employee-list-table thead th {
    color: #6b7280;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid #e5e7eb;
}

.employee-list-table tbody td {
    color: #374151;
    font-size: 14px;
    padding-top: 15px;
    padding-bottom: 15px;
}

.employee-list-table tbody tr:last-child td {
    border-bottom: none;
}

        .employee-list-table tbody tr {
    transition: 0.2s;
}

.employee-list-table tbody tr:hover {
    background-color: #f8fafc;
}

  .department-badge {
    display: inline-block;

    padding: 6px 10px;

    background: #f3f4f6;

    color: #374151;

    border-radius: 8px;

    font-size: 12px;

    font-weight: 600;
}
        .department-page-title {
    color: #111827;
    font-size: 20px;
    font-weight: 700;
}

.department-card {
    height: 100%;
    transition: 0.2s;
}

.department-card:hover {
    transform: translateY(-3px);
}

.department-icon {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;
    border-radius: 10px;

    font-size: 18px;

    margin-bottom: 18px;
}

.department-name {
    color: #111827;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
}

.department-id {
    color: #9ca3af;
    font-size: 13px;
}
    </style>


</head>

<body>

<div class="sidebar">

    <h3>EmployeeMS</h3>

    <div class="user-box">

    <div class="user-icon">
        👤
    </div>

    <div>
        <small>Logged in as</small>
        <strong>{{ request.user.username }}</strong>
    </div>

</div>

    <a href="/">🏠 Dashboard</a>

    <a href="/employees/">👥 Employees</a>

    <a href="/departments/">🏢 Departments</a>

    <a href="/api/employees/">🔗 API</a>

    <a href="/admin/">⚙ Admin</a>

    <form method="post" action="/logout/" style="margin-top: 15px;">

    {% csrf_token %}

    <button
        type="submit"
        style="
            width: 100%;
            border: none;
            background: transparent;
            color: #d1d5db;
            text-align: left;
            padding: 13px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        "
    >
        🚪 Logout
    </button>

</form>

</div>

<div class="main">

    <div class="topbar">
        <h4 class="mb-0">
            {% block page_title %}Dashboard{% endblock %}
        </h4>
    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
