{% extends 'employees/base.html' %}

{% block title %}
Delete Employee
{% endblock %}

{% block page_title %}
Delete Employee
{% endblock %}

{% block content %}

<div class="card p-4">

    <h5>Delete Employee</h5>

    <p class="mt-3">
        Are you sure you want to delete
        <strong>{{ employee.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="/employees/" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
