<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );

            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #1f2937;
            color: white;

            font-size: 26px;
            font-weight: bold;
        }

        .login-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;

            color: #111827;

            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;

            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            height: 48px;

            border-radius: 10px;
            border: 1px solid #d1d5db;

            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            height: 48px;

            border: none;
            border-radius: 10px;

            background: #1f2937;
            color: white;

            font-weight: 600;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #111827;
            transform: translateY(-1px);
        }

        .error-message {
            border-radius: 10px;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;

            color: #9ca3af;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            EM
        </div>

        <h2 class="login-title">
            Welcome Back
        </h2>

        <p class="login-subtitle">
            Login to Employee Management System
        </p>


        {% if error %}

        <div class="alert alert-danger error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn login-btn w-100"
            >
                Login
            </button>

        </form>


        <div class="footer-text">
            Employee Management System
        </div>

    </div>

</div>

</body>

</html>
